        <h1>REGISTRATI A PSYPLATFORM</h1>
        <p>Hai già un account? <u><a href="accedi.html">accedi ora</a></u></p>

        <form action="">
            <div class="form-fields">
                <div class="tipologia-utente">
                    <label for="tipologia-utente"><strong>Seleziona la tua tipologia</strong></label>

                    <label class="custom-radio">
                        <input type="radio" name="tipologia-utente" value="paziente" checked> Paziente
                        <span class="radio-checkmark"></span>
                    </label>

                    <label class="custom-radio">
                        <input type="radio" name="tipologia-utente" value="psicologo"> Psicologo
                        <span class="radio-checkmark"></span>
                    </label>
                </div>

                <label for="nome"><strong>Nome</strong></label>
                <input type="text" name="nome" placeholder="Inserire il proprio nome" required>

                <label for="cognome"><strong>Cognome</strong></label>
                <input type="text" name="cognome" placeholder="Inserire il proprio cognome" required>

                <label for="email"><strong>Email</strong></label>
                <input type="text" name="email" placeholder="Inserire la propria email" required>

                <label for="provincia"><strong>Provincia</strong></label>
                <input type="text" list="listaProvince" id="provincia" name="provincia" placeholder="Scrivi o scegli una provincia" required>
