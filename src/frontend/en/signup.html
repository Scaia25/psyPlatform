<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsyPlatform - sign up</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="registrati.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,800;1,800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <label>PsyPlatform</label>

        <div class="menu">
            <div class="sections-menu">
                <a href="index.html">Home</a>
                <a href="psychologists.html">For psychologists</a>
                <a href="patients.html">For patients</a>
                <a href="pricing.html">Pricing</a>
                <a href="contact.html">Contact</a>
            </div>

            <div class="menu-buttons">
                <a href="login.html"><button>Login</button></a>
                <a href="signup.html"><button>Sign Up</button></a>
            </div>
        </div>
    </header>

    <div class="hero">
        <h1>SIGN UP FOR PSYPLATFORM</h1>
        <p>Already have an account? <u><a href="login.html">login now</a></u></p>

        <form action="" method="">
            <div class="form-fields">
                <div class="user-type">
                    <label for="user-type"><strong>Select your user type</strong></label>

                    <label class="custom-radio">
                        <input type="radio" name="user-type" value="patient" checked> Patient
                        <span class="radio-checkmark"></span>
                    </label>

                    <label class="custom-radio">
                        <input type="radio" name="user-type" value="psychologist"> Psychologist
                        <span class="radio-checkmark"></span>
                    </label>
                </div>

                <label for="name"><strong>First Name</strong></label>
                <input type="text" name="name" placeholder="Enter your first name" required>

                <label for="surname"><strong>Last Name</strong></label>
                <input type="text" name="surname" placeholder="Enter your last name" required>

                <label for="email"><strong>Email</strong></label>
                <input type="text" name="email" placeholder="Enter your email" required>

                <label for="password"><strong>Password</strong></label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>

</html>
