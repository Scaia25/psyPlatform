<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsyPlatform - registrati</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="registrati.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,800;1,800&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <label>PsyPlatform</label>

        <div class="menu">
            <div class="sections-menu">
                <a href="index.html">Home</a>
                <a href="psicologi.html">Per psicologi</a>
                <a href="pazienti.html">Per pazienti</a>
                <a href="prezzi.html">Prezzi</a>
                <a href="contatti.html">Contatti</a>
            </div>

            <div class="menu-buttons">
                <a href="accedi.html"><button>Accedi</button></a>
                <a href="registrati.html"><button>Registrati</button></a>
            </div>
        </div>
    </header>

    <div class="hero">
        <h1>REGISTRATI A PSYPLATFORM</h1>
        <p>Hai già un account? <u><a href="accedi.html">accedi ora</a></u></p>

        <form action="" method="">
            <div class="form-fields">
                <div class="user-type">
                    <label for="user-type"><strong>Seleziona la tua tipologia</strong></label>

                    <label class="custom-radio">
                        <input type="radio" name="user-type" value="patient" checked> Paziente
                        <span class="radio-checkmark"></span>
                    </label>

                    <label class="custom-radio">
                        <input type="radio" name="user-type" value="psychologist"> Psicologo
                        <span class="radio-checkmark"></span>
                    </label>
                </div>

                <label for="name"><strong>Nome</strong></label>
                <input type="text" name="name" placeholder="Inserire il proprio nome" required>

                <label for="surname"><strong>Cognome</strong></label>
                <input type="text" name="surname" placeholder="Inserire il proprio cognome" required>

                <label for="email"><strong>Email</strong></label>
                <input type="text" name="email" placeholder="Inserire la propria email" required>

                <label for="password"><strong>Password</strong></label>
                <input type="password" name="password" placeholder="Inserire la propria password" required>
            </div>

            <button type="submit">Accedi</button>
        </form>
    </div>
</body>

</html>
